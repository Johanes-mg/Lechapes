[package]
name = "lechapes"
version = "0.5.0"
edition = "2021"
description = "Editeur de texte leger multi-onglets"
authors = ["Johanes-mg"]

[[bin]]
name = "lechapes"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
image = { version = "0.25", features = ["png", "ico", "jpeg", "gif", "bmp", "tiff", "webp"] }
encoding_rs = "0.8"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
