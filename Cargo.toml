[package]
name = "lechapes"
version = "3.1.6"
edition = "2021"
description = "Editeur de texte leger multi-onglets"
authors = ["Johanes-mg"]

[[bin]]
name = "lechapes"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
image = { version = "0.25", features = ["png", "ico", "jpeg", "gif", "bmp", "tiff", "webp"] }
encoding_rs = "0.8"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
